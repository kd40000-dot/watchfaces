name: Validate and build Arcs Dracula for Wear OS 5
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent development signing key
        run: |
          base64 --decode ci/arcs-dev-signing.jks.b64 > ci/arcs-dev-signing.jks
          keytool -list -keystore ci/arcs-dev-signing.jks -storepass ArcsDraculaDev26 -alias arcsdev
      - name: Validate Watch Face Format 2 XML
        run: |
          curl -fsSL --retry 3 -o /tmp/wff-validator.jar https://github.com/google/watchface/releases/download/release/wff-validator.jar
          java -jar /tmp/wff-validator.jar 2 watchface/src/main/res/raw/watchface.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :watchface:assembleDebug
      - name: Verify debug package exists
        run: |
          ls -lh watchface/build/outputs/apk/debug/*.apk
          unzip -t watchface/build/outputs/apk/debug/*.apk | tail -2
      - name: Generate bitmap preview for OEM watch face picker
        run: |
          python3 -m pip install --quiet Pillow
          python3 ci/make_picker_preview.py
          test -s legacy/src/main/res/drawable-nodpi/preview_bitmap.png
      - name: Build sensor-driven companion face
        run: gradle --no-daemon :legacy:assembleDebug
      - name: Check complication chooser manifest
        run: |
          APK=legacy/build/outputs/apk/debug/legacy-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q 'com.google.android.wearable.permission.RECEIVE_COMPLICATION_DATA' /tmp/permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'ComplicationHelperActivity' /tmp/manifest.txt
          grep -q 'ArcsEditorActivity' /tmp/manifest.txt
          echo "Editor launcher, helper and complication permission present."
      - name: Upload sensor-driven APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcs-Dracula-Live-Compass-WearOS5-experimental
          path: legacy/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcs-Dracula-Compass-WearOS5-debug
          path: watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
