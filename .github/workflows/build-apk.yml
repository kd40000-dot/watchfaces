name: Validate and build Arcs Dracula for Wear OS 5
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Watch Face Format 2 XML
        run: |
          curl -fsSL --retry 3 -o /tmp/wff-validator.jar https://github.com/google/watchface/releases/download/release/wff-validator.jar
          java -jar /tmp/wff-validator.jar 2 watchface/src/main/res/raw/watchface.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :watchface:assembleDebug
      - name: Verify debug package exists
        run: |
          ls -lh watchface/build/outputs/apk/debug/*.apk
          unzip -t watchface/build/outputs/apk/debug/*.apk | tail -2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcs-Dracula-Compass-WearOS5-debug
          path: watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
